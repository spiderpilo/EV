[project]
name = "ev-assistant"
version = "0.1.0"
description = "EV — a local virtual assistant with face/voice recognition and a fine-tuned LLM brain"
requires-python = ">=3.10"
dependencies = [
    "mlx>=0.18",
    "mlx-lm>=0.19",
    "mlx-whisper>=0.4",
    "openwakeword>=0.6",
    "face-recognition>=1.3",
    "speechbrain>=1.0",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "Pillow>=10.0",
    "pyttsx3>=2.90",
    "torchaudio>=2.0",
    "torch>=2.0",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
fine-tune = [
    "mlx-lm[fine-tune]",
    "datasets>=2.14",
    "huggingface-hub>=0.20",
]

[project.scripts]
ev = "ev.main:main"
ev-enroll-face = "scripts.enroll_face:main"
ev-enroll-voice = "scripts.enroll_voice:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
