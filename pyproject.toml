[project]
name = "ev-assistant"
version = "0.1.0"
description = "EV — a local virtual assistant with face/voice recognition and a fine-tuned LLM brain"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "transformers>=4.40",
    "accelerate>=0.27",
    "bitsandbytes>=0.43",
    "faster-whisper>=1.0",
    "openwakeword>=0.6",
    "face-recognition>=1.3",
    "speechbrain>=1.0",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "Pillow>=10.0",
    "piper-tts>=1.4",
    "opencv-python>=4.8",
    "duckduckgo-search>=6.0",
]

[project.optional-dependencies]
fine-tune = [
    "peft>=0.10",
    "trl>=0.8",
    "datasets>=2.14",
    "huggingface-hub>=0.20",
]

[project.scripts]
ev = "ev.main:main"
ev-enroll-face = "scripts.enroll_face:main"
ev-enroll-voice = "scripts.enroll_voice:main"

[tool.setuptools.packages.find]
include = ["ev*", "scripts*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
